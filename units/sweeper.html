<h1>Sweeper（安瓿）</h1>
<p>無攻擊力的特殊飛行單位。可讓炸藥、偽裝、迷彩、隱形等敵方單位被偵測並攻擊。</p>
<ul>
<li>基礎HP：1500（初期版本 500）</li>
<li>空間：90</li>
<li>重量：100</li>
</ul>

<tr><th>名稱</th><th>技術等級</th><th>能量消耗</th><th>說明</th></tr>

<tr><td>防護幕-I</td><td>15</td><td>1000</td><td>為友軍施加護盾</td></tr>
<tr><td>偽裝追蹤器</td><td>44</td><td>70</td><td>使使用偽裝的 Humanoid 現形</td></tr>
