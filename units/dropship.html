<h1>Dropship（運輸船）</h1>
<p>運輸船。基本只能載運 1 單位。升級後可裝備心靈傳動，一次傳送一台單位。有些戰場沒有它就無法佔領。無攻擊力。</p>
<ul>
<li>基礎HP：1000（初期版本 250）</li>
<li>空間：110（初期版本 90）</li>
<li>重量：100</li>
</ul>
