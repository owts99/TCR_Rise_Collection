<h1>Eclipse（日蝕）</h1>
<p>製造瞬間移動傳送門的單位。戰略上很有用，可在交戰激烈處放置攻擊單位、安靜處放置治療單位。必須有兩台以上才能使用。僅在舒梅行星販售。</p>
<ul>
<li>基礎HP：1500（初期版本 200）</li>
<li>空間：120</li>
<li>重量：150</li>
</ul>
